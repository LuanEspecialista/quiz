<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central de Conversão | Luan Especialista</title>

<link rel="stylesheet" href="assets/css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="background-glow"></div>

<header class="hero">

<img

src="imagens/logo.png"

class="logo"

alt="Luan Especialista"

>

<h1>

CENTRAL DE CONVERSÃO

</h1>

<p>

Escolha uma construtora, selecione um empreendimento e utilize o roteiro ideal para levar o cliente até uma reunião presencial ou Meet.

</p>

</header>

<section class="search-area">

<input

id="search"

type="text"

placeholder="Pesquisar construtora ou empreendimento..."

>

</section>

<section class="chips-section">

<h2>

Construtoras

</h2>

<div

id="construtoras"

class="chips"

></div>

</section>

<section class="chips-section">

<h2>

Empreendimentos

</h2>

<div

id="empreendimentos"

class="chips"

></div>

</section>

<main class="workspace">

<aside

id="sidebar"

class="sidebar"

>

</aside>

<section

id="content"

class="content"

>

<div class="empty-state">

<h3>

Bem-vindo.

</h3>

<p>

Selecione uma construtora para iniciar.

</p>

</div>

</section>

</main>

<script src="assets/js/app.js"></script>

</body>

</html>
