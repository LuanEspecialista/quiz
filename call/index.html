<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Central de Conversão | Luan Especialista</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="background-glow"></div>

<header class="hero">

<img
src="../imagens/logo.png"
class="logo"
alt="Luan Especialista">

<h1>

CENTRAL DE CONVERSÃO

</h1>

<p>

Transformando interessados em reuniões presenciais e apresentações online.

</p>

</header>

<section class="search-area">

<input
id="search"
type="text"
placeholder="Pesquisar construtora ou empreendimento...">

</section>

<section class="chips-section">

<h2>

Construtoras

</h2>

<div
id="construtoras"
class="chips">

</div>

</section>

<section
id="empreendimentos-section"
class="chips-section hidden">

<h2>

Empreendimentos

</h2>

<div
id="empreendimentos"
class="chips">

</div>

</section>

<main class="workspace">

<aside
id="sidebar"
class="sidebar">

<div class="empty-sidebar">

Selecione um empreendimento

</div>

</aside>

<section
id="content"
class="content">

<div class="empty-state">

<h2>

Bem-vindo.

</h2>

<p>

Escolha uma construtora para começar.

</p>

</div>

</section>

</main>

<script src="assets/js/app.js"></script>

</body>

</html>
