<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central de Conversão | Luan Especialista</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="background-glow"></div>

<header class="hero">

    <div class="hero-left">

        <img
        src="../imagens/logo.png"
        class="logo"
        alt="Luan Especialista">

    </div>

    <div class="hero-center">

        <h1>

            CENTRAL DE CONVERSÃO

        </h1>

        <p>

            Reuniões presenciais • Google Meet • WhatsApp

        </p>

    </div>

    <div class="hero-right">

        <input

            id="search"

            class="search"

            type="text"

            placeholder="Pesquisar..."

        >

    </div>

</header>

<section class="filters">

    <div class="filter">

        <label>

            CONSTRUTORAS

        </label>

        <div

            id="construtoras"

            class="chips">

        </div>

    </div>

    <div

        id="empreendimentos-section"

        class="filter hidden">

        <label>

            EMPREENDIMENTOS

        </label>

        <div

            id="empreendimentos"

            class="chips">

        </div>

    </div>

</section>

<div class="separator"></div>

<main class="workspace">

    <aside

        id="sidebar"

        class="sidebar">

        <div class="empty-sidebar">

            Selecione um empreendimento

        </div>

    </aside>

    <section

        id="content"

        class="content">

        <div class="empty-state">

            <h2>

                Central de Conversão

            </h2>

            <p>

                Escolha uma construtora para iniciar.

            </p>

        </div>

    </section>

</main>

<script src="assets/js/app.js"></script>

</body>

</html>
