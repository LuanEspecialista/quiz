<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luan Especialista - Apresentações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
      if (!new URLSearchParams(location.search).get("empreendimento")) {
        location.replace("/painel/?tab=apresentacoes");
      }
    </script>
<script src="/assets/site-config.js"></script><script defer src="/assets/site-runtime.js"></script></head>
<body>

    <header class="main-header">
        <a class="logo-container" href="/" aria-label="Ir para a página inicial" style="text-decoration:none">
            <img src="/imagens/logo.png" alt="Luan Especialista" class="logo-img">
            <div class="logo-text">
                <h1>Luan Especialista</h1>
                <p>CURADORIA PATRIMONIAL</p>
            </div>
        </a>
        <button class="btn-fullscreen" id="btn-fullscreen">Tela cheia</button>
    </header>

    <!-- ÁREA CENTRAL: VISUALIZADOR DE PDF COM LOADING E MÁSCARA -->
    <main class="viewer-container">
        <button type="button" id="btn-exit-fullscreen" class="btn-exit-fullscreen">Sair · Esc</button>
        <!-- Mensagem de instruções inicial -->
        <div id="viewer-placeholder" class="placeholder-text">
            <p>Preparando a apresentação selecionada...</p>
        </div>

        <!-- Animação de Carregamento -->
        <div id="loading-spinner" class="spinner-container hidden">
            <div class="spinner"></div>
            <p>Carregando apresentação imobiliária...</p>
        </div>

        <!-- Máscara invisível que bloqueia o clique duplo/extração de texto, mas deixa scrollar -->
        <div id="pdf-overlay" class="pdf-mask hidden"></div>

        <iframe id="pdf-viewer" src="" class="pdf-frame hidden" frameborder="0" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
    </main>

    <!-- RODAPÉ COMPLETO E ALINHADO (PADRÃO MOCKUP) -->
    <footer class="main-footer">
        <div class="nav-buttons">
            <button id="btn-anterior" class="btn-nav" disabled>Anterior</button>
            <button id="btn-proximo" class="btn-nav" disabled>Próximo</button>
            <select id="select-tipologia-unidades" class="select-tipologia hidden" aria-label="Tipologia desejada">
                <option value="">Todas as tipologias</option>
            </select>
            <a id="btn-unidades" class="btn-unidades hidden" href="#">Ver unidades disponíveis</a>
        </div>

        <div class="footer-info">
            <a href="tel:47992120915" class="info-link">47 99212-0915</a>
            <div class="separator"></div>
            <a href="https://luan-especialista.pro" target="_blank" class="info-link">luan-especialista.pro</a>
            <div class="separator"></div>
            <a href="mailto:contato@luan-especialista.pro" class="info-link">contato@luan-especialista.pro</a>
            <div class="separator"></div>
            <a href="https://solimoveis.com.br" target="_blank" class="info-link">solimoveis.com.br</a>
        </div>

        <div class="parceria-container">
            <img src="assets/img/sol.png" alt="Sol Imóveis" class="logo-sol-img">
            <div class="parceria-text">
                
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (async function protegerApresentacao() {
        const id = new URLSearchParams(location.search).get("empreendimento");
        const localPreview = ["localhost", "127.0.0.1"].includes(location.hostname);
        const liberarVisualizador = async () => {
          document.body.classList.add("apresentacao-autorizada", "modo-direto");
          for (const src of ["./assets/js/dados.js?v=20260828-1", "./assets/js/viewer.js?v=20260828-1"]) {
            await new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = src;
              script.onload = resolve;
              script.onerror = reject;
              document.body.appendChild(script);
            });
          }
        };
        if (!id) return;
        if (localPreview) {
          await liberarVisualizador();
          return;
        }
        if (!window.supabase || !window.LUAN_SITE_CONFIG) {
          document.body.classList.add("apresentacao-autorizada");
          document.getElementById("viewer-placeholder").innerHTML = "<p>Não foi possível validar o acesso. Atualize a página.</p>";
          return;
        }
        const config = window.LUAN_SITE_CONFIG;
        const client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        const { data } = await client.auth.getSession();
        if (!data.session) {
          const retorno = encodeURIComponent(location.pathname + location.search);
          location.replace("/painel/?return=" + retorno);
          return;
        }
        const { data: perfil } = await client.from("perfis_usuario").select("perfil,ativo").eq("user_id", data.session.user.id).maybeSingle();
        if (!perfil?.ativo || !["admin", "equipe"].includes(perfil.perfil)) {
          location.replace("/painel/");
          return;
        }
        await liberarVisualizador();
      })();
    </script>
</body>
</html>
